<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StemMIDI — Stem & Chord Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* DAW 風ダークテーマ — 発光グラデーションなしのソリッドなデザイン */
    :root {
      --bg: #121214;
      --bg-elev: #18181B;
      --bg-elev-2: #1F1F23;
      --bg-input: #232327;
      --border: #2A2A2E;
      --border-strong: #3F3F46;
      --text: #E4E4E7;
      --text-dim: #A1A1AA;
      --text-faint: #71717A;
      --accent: #F59E0B;      /* アンバー */
      --accent-strong: #F97316; /* オレンジ */
      --accent-bg: rgba(245, 158, 11, 0.10);
      --ok: #22C55E;
      --danger: #EF4444;
      --mono: "JetBrains Mono", "Fira Code", "SF Mono", "Menlo", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: var(--mono); }

    /* ヘッダー */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elev);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: 0.08em; }
    .brand span { color: var(--accent); }
    .header-label { font-family: var(--mono); font-size: 11px; color: var(--text-faint); letter-spacing: 0.12em; }

    main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }

    /* 入力パネル */
    .input-panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .drop-zone {
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      color: var(--text-dim);
      transition: border-color 0.15s, background 0.15s;
      font-size: 14px;
    }
    .drop-zone:hover { border-color: var(--accent); }
    .drop-zone.dragover { border-color: var(--accent); background: var(--accent-bg); }
    .drop-zone .drop-icon { font-size: 26px; margin-bottom: 8px; color: var(--accent); }
    .divider { text-align: center; color: var(--text-faint); font-size: 11px; font-family: var(--mono); margin: 16px 0; letter-spacing: 0.2em; }
    .youtube-row { display: flex; gap: 10px; }
    .youtube-row input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
    }
    .youtube-row input:focus { border-color: var(--accent); }
    .youtube-row input::placeholder { color: var(--text-faint); }
    .btn {
      background: var(--accent);
      color: #18181B;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-strong); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ローディング */
    #loading { text-align: center; padding: 40px 0; }
    .loader-bar { width: 280px; height: 3px; margin: 0 auto 16px; background: var(--bg-elev-2); border-radius: 2px; overflow: hidden; }
    .loader-bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--accent);
      animation: loading 1.1s ease-in-out infinite;
    }
    @keyframes loading { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    #loading-text { color: var(--text-dim); font-size: 13px; font-family: var(--mono); }

    /* 結果 */
    .meta-bar {
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 14px;
    }
    .meta-item { display: flex; flex-direction: column; gap: 2px; }
    .meta-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); letter-spacing: 0.12em; }
    .meta-value { font-family: var(--mono); font-size: 16px; font-weight: 600; }
    .meta-spacer { flex: 1; }
    .btn-secondary {
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 18px;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 14px;
    }
    .panel-title {
      font-family: var(--mono); font-size: 11px; color: var(--text-faint);
      letter-spacing: 0.14em; margin-bottom: 14px;
    }

    /* トランスポート */
    .transport { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .transport-btn {
      width: 46px; height: 46px; flex-shrink: 0;
      background: var(--bg-elev-2);
      border: 1px solid var(--border-strong);
      border-radius: 50%;
      color: var(--accent);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .transport-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
    .time-display { font-family: var(--mono); font-size: 13px; color: var(--text-dim); white-space: nowrap; }
    .waveform-wrap { position: relative; flex: 1; min-width: 240px; }
    #waveform { width: 100%; height: 84px; display: block; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }
    #youtube-player { width: 100%; max-width: 480px; height: 270px; border: 1px solid var(--border); border-radius: 6px; background: #000; }

    /* コードタイムライン */
    #chord-timeline { display: flex; align-items: stretch; height: 44px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    .chord-cell {
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-weight: 600; font-size: 13px;
      color: #18181B;
      background: var(--accent);
      border-right: 1px solid rgba(24, 24, 27, 0.35);
      cursor: pointer;
      white-space: nowrap; overflow: hidden;
      transition: filter 0.12s;
    }
    .chord-cell:last-child { border-right: none; }
    .chord-cell:hover { filter: brightness(1.12); }
    .chord-cell.active { filter: brightness(1.3); background: var(--accent-strong); }

    /* ピアノロール */
    #piano-roll { width: 100%; height: 320px; display: block; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }

    .hidden { display: none !important; }
    .error-message {
      margin-top: 14px; padding: 12px 16px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: var(--danger);
      font-size: 13px;
      font-family: var(--mono);
    }
    #file-info { margin-top: 10px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">Stem<span>MIDI</span></div>
    <div class="header-label">STEM / CHORD ANALYZER</div>
  </header>

  <main>
    <section class="input-panel" id="upload-section">
      <div class="drop-zone" id="drop-zone">
        <div class="drop-icon">♪</div>
        <div>音声ファイルをドロップ、またはクリックして選択</div>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg,.aac" hidden>
      </div>
      <div id="file-info" class="hidden"></div>
      <div class="divider">— OR —</div>
      <div class="youtube-row">
        <input type="text" id="youtube-url" placeholder="YouTube URL を貼り付けて解析">
        <button id="youtube-btn" class="btn">解析</button>
      </div>
    </section>

    <section id="loading" class="hidden">
      <div class="loader-bar"></div>
      <div id="loading-text">ANALYZING — STEM SEPARATION / CHORD / BASS / BEAT</div>
    </section>

    <section id="results" class="hidden">
      <div class="meta-bar">
        <div class="meta-item"><span class="meta-label">TRACK</span><span id="meta-title">—</span></div>
        <div class="meta-item"><span class="meta-label">BPM</span><span id="meta-bpm" class="mono">—</span></div>
        <div class="meta-item"><span class="meta-label">CHORDS</span><span id="meta-chords" class="mono">—</span></div>
        <div class="meta-item"><span class="meta-label">BEATS</span><span id="meta-beats" class="mono">—</span></div>
        <div class="meta-spacer"></div>
        <button id="download-btn" class="btn-secondary">⬇ ダウンロード MIDI</button>
      </div>

      <div class="panel">
        <div class="panel-title">TRANSPORT</div>
        <div class="transport">
          <button id="play-btn" class="transport-btn">▶</button>
          <div class="time-display"><span id="time-current">00:00.0</span> / <span id="time-total">00:00.0</span></div>
          <div class="waveform-wrap">
            <canvas id="waveform"></canvas>
          </div>
        </div>
        <div id="youtube-player" class="hidden" style="margin-top: 14px;"></div>
      </div>

      <div class="panel">
        <div class="panel-title">CHORD TIMELINE — CLICK TO SEEK</div>
        <div id="chord-timeline"></div>
      </div>

      <div class="panel">
        <div class="panel-title">PIANO ROLL — AMBER: CHORDS / GREEN: BASS</div>
        <canvas id="piano-roll"></canvas>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
