<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StemMIDI | 音源からマルチトラックMIDIを自動生成</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --panel-border: #2a2f3d;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --danger: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.05em;
    }
    header p { color: var(--text-dim); margin-top: 0.5rem; }
    main { max-width: 960px; margin: 0 auto; padding: 0 1rem 3rem; }

    /* アップロードゾーン */
    #drop-zone {
      border: 2px dashed var(--panel-border);
      border-radius: 16px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--panel);
    }
    #drop-zone:hover { border-color: var(--accent); }
    #drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }
    #drop-zone .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    #drop-zone .main-text { font-size: 1.2rem; font-weight: 600; }
    #drop-zone .sub-text { color: var(--text-dim); font-size: 0.9rem; margin-top: 0.4rem; }
    #file-info {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      color: var(--text-dim);
    }

    /* ローディング */
    #loading { text-align: center; padding: 3rem 1rem; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid var(--panel-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--text-dim); margin-top: 0.4rem; }

    /* 結果 */
    .result-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
      margin-bottom: 1rem;
    }
    .result-header h2 { font-size: 1.4rem; }
    #result-meta { color: var(--text-dim); margin-top: 0.3rem; }
    .controls { display: flex; gap: 0.75rem; }
    button {
      padding: 0.6rem 1.2rem;
      border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #play-btn { background: var(--accent); color: #fff; }
    #play-btn:hover { background: var(--accent-hover); }
    #download-btn { background: var(--panel); color: var(--text); border: 1px solid var(--panel-border); }
    #download-btn:hover { border-color: var(--accent); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .panel h3 { font-size: 1rem; margin-bottom: 1rem; color: var(--text-dim); font-weight: 600; }

    /* コードタイムライン */
    #chord-timeline {
      display: flex;
      align-items: stretch;
      height: 48px;
      border-radius: 8px;
      overflow: hidden;
    }
    .chord-cell {
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
      color: #0f1117;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-right: 1px solid rgba(15, 17, 23, 0.3);
      white-space: nowrap;
      transition: filter 0.15s;
    }
    .chord-cell.active { filter: brightness(1.4); }

    /* ピアノロール */
    #piano-roll {
      width: 100%;
      height: 320px;
      background: #12151d;
      border-radius: 8px;
      display: block;
    }

    .hidden { display: none !important; }
    .error-message {
      margin-top: 1rem; padding: 0.9rem 1rem;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--danger);
      border-radius: 10px;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <h1>StemMIDI</h1>
    <p>音源から「コード進行」「ベースライン」「リズム」を解析し、マルチトラック MIDI を生成します</p>
  </header>

  <main>
    <section id="upload-section">
      <div id="drop-zone">
        <div class="icon">🎵</div>
        <div class="main-text">音声ファイルをドラッグ＆ドロップ</div>
        <div class="sub-text">またはクリックしてファイルを選択（MP3 / WAV / M4A / FLAC 対応）</div>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.flac,.ogg,.aac" hidden>
      </div>
      <div id="file-info" class="hidden"></div>
    </section>

    <section id="loading" class="hidden">
      <div class="spinner"></div>
      <p><strong>解析中...</strong></p>
      <p id="loading-step">音源分離・コード解析・MIDI 生成には数分かかる場合があります</p>
    </section>

    <section id="results" class="hidden">
      <div class="result-header">
        <div>
          <h2>解析結果</h2>
          <p id="result-meta"></p>
        </div>
        <div class="controls">
          <button id="play-btn">▶ 再生</button>
          <button id="download-btn">⬇ MIDI ダウンロード</button>
        </div>
      </div>

      <div class="panel">
        <h3>コード進行タイムライン</h3>
        <div id="chord-timeline"></div>
      </div>

      <div class="panel">
        <h3>ピアノロール（青: コード / 緑: ベース）</h3>
        <canvas id="piano-roll"></canvas>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
